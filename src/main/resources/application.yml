spring:
  application:
    name: assessment

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${SPRING_DATASOURCE_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: always

  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            audience: ${AUTH0_AUDIENCE}
        provider:
          auth0:
            issuer-uri: ${AUTH0_ISSUER_URI}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

aws:
  region: ${AWS_REGION:eu-west-1}
  endpoint-override: ${AWS_ENDPOINT_OVERRIDE:}
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${AWS_S3_KB_BUCKET}
  sns:
    document-uploaded-topic-arn: ${AWS_SNS_DOCUMENT_UPLOADED_TOPIC_ARN}
    answer-grading-topic-arn: ${AWS_SNS_ANSWER_GRADING_TOPIC_ARN}
  knowledge-base:
    callback-secret: ${KB_CALLBACK_SECRET}
    callback-base-url: ${KB_CALLBACK_BASE_URL:}
    max-file-size-bytes: ${KB_MAX_FILE_SIZE_BYTES:26214400}
